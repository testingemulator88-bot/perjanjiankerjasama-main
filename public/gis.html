    document.getElementById('export-png').addEventListener('click', function () {
      map.once('rendercomplete', function () {
        const mapCanvas = document.createElement('canvas');
        const size = map.getSize();
        mapCanvas.width = size[0];
        mapCanvas.height = size[1];
        const mapContext = mapCanvas.getContext('2d');
        Array.prototype.forEach.call(
          map.getViewport().querySelectorAll('.ol-layer canvas, canvas.ol-layer'),
          function (canvas) {
            if (canvas.width > 0) {
              const opacity =
                canvas.parentNode.style.opacity || canvas.style.opacity;
              mapContext.globalAlpha = opacity === '' ? 1 : Number(opacity);
              let matrix;
              const transform = canvas.style.transform;
              if (transform) {
                // Get the transform parameters from the style's transform matrix
                matrix = transform
                  .match(/^matrix\(([^\(]*)\)$/)[1]
                  .split(',')
                  .map(Number);
              } else {
                matrix = [
                  parseFloat(canvas.style.width) / canvas.width,
                  0,
                  0,
                  parseFloat(canvas.style.height) / canvas.height,
                  0,
                  0,
                ];
              }
              // Apply the transform to the export map context
              CanvasRenderingContext2D.prototype.setTransform.apply(
                mapContext,
                matrix,
              );
              const backgroundColor = canvas.parentNode.style.backgroundColor;
              if (backgroundColor) {
                mapContext.fillStyle = backgroundColor;
                mapContext.fillRect(0, 0, canvas.width, canvas.height);
              }
              mapContext.drawImage(canvas, 0, 0);
            }
          },
        );
        mapContext.globalAlpha = 1;
        mapContext.setTransform(1, 0, 0, 1, 0, 0);
        const link = document.getElementById('image-download');
        link.href = mapCanvas.toDataURL();
        link.click();
      });
      map.renderSync();
    });

    function kelokasi() {
      if ((document.getElementById('carilatitude').value == '') || (document.getElementById('carilongitude').value == '')) {
        parent.document.getElementById('koordinat').click();
        return false;
      }
      else {
        var i, lat, lon, geom, feature, features = [];
        var lng = document.getElementById('carilongitude').value;
        var lat = document.getElementById('carilatitude').value;

        geom = new ol.geom.Point(
          ol.proj.transform([lng, lat], 'EPSG:4326', 'EPSG:3857')
        );

        vectorLayerLokasi.setZIndex(999999);
        feature = new ol.Feature(geom);
        feature.setStyle(customStyleLokasi);
        features.push(feature);
        vectorSourceLokasi.addFeatures(features);
        map.getView().setCenter(ol.proj.transform([lng, lat], 'EPSG:4326', 'EPSG:3857'));
        map.getView().setZoom(16);
        return features;
      }

      map.getLayers().forEach(layer => {

          if (layer.get('name') && layer.get('name') == parent.document.getElementById('paramlayerunduh').value) {
            layer.getSource().forEachFeature(function (feature) {
              var objetomulti = feature.getProperties();
              var detaildatamulti = [];
              for (propiedadesmulti in objetomulti) {
                if ((propiedadesmulti != 'geometry') && (propiedadesmulti != 'stroke') && (propiedadesmulti != 'TEXT_LABEL') && (propiedadesmulti != 'KODE') && (propiedadesmulti != 'LABEL_DATA') && (propiedadesmulti != 'strokewidt') && (propiedadesmulti != 'stroke-width') && (propiedadesmulti != 'stroke-opacity') && (propiedadesmulti != 'fill') && (propiedadesmulti != 'fill-opacity') && (propiedadesmulti != 'dash_start') && (propiedadesmulti != 'dash_end') && (propiedadesmulti != 'fillwidt') && (propiedadesmulti != 'gambar') && (propiedadesmulti != 'KodeKabkot') && (propiedadesmulti != 'tipe_fill') && (propiedadesmulti != 'tipe_pattern') && (propiedadesmulti != 'sudut') && (propiedadesmulti != 'ID') && (propiedadesmulti != 'deleted') && (propiedadesmulti != 'kodelocksimfast') && (propiedadesmulti != 'kodetahun')) {
                  detaildatamulti.push({
                    "kolom": propiedadesmulti,
                    "data": objetomulti[propiedadesmulti],
                  });
                }
              }
              datamulti.push(detaildatamulti);
            });
            var uniqueArray = datamulti.filter((o, index, arr) =>
              arr.findIndex(item => JSON.stringify(item) === JSON.stringify(o)) === index
            );
            parent.document.getElementById('detaildatamulti').value = '';
            parent.document.getElementById('detaildatamulti').value = JSON.stringify(uniqueArray);
            parent.document.getElementById('tombolparamunduh').click();
            return false;
          }
        } catch (error) {

        }
